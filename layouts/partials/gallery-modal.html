{{- with .Params.gallery -}}
<div
  x-data="{
    open: false,
    current: 0,
    images: {{ . | jsonify }},
    baseUrl: '{{ $.RelPermalink }}',
    show(index) { this.current = index; this.open = true; },
    prev() { this.current = (this.current - 1 + this.images.length) % this.images.length; },
    next() { this.current = (this.current + 1) % this.images.length; },
    touchStartX: 0,
    onTouchStart(e) { this.touchStartX = e.changedTouches[0].screenX; },
    onTouchEnd(e) {
      const dx = e.changedTouches[0].screenX - this.touchStartX;
      if (Math.abs(dx) > 50) { dx < 0 ? this.next() : this.prev(); }
    }
  }"
  @gallery-open.window="show($event.detail.index)"
  @keydown.escape.window="open = false"
  @keydown.arrow-left.window="open && prev()"
  @keydown.arrow-right.window="open && next()"
>
  <!-- Backdrop -->
  <div
    x-show="open"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    class="flex fixed inset-0 z-50 justify-center items-center bg-black/90"
    @click.self="open = false"
    @touchstart="onTouchStart($event)"
    @touchend="onTouchEnd($event)"
  >
    <!-- Close -->
    <button @click="open = false" class="absolute top-4 right-4 text-white opacity-70 transition-opacity hover:opacity-100">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-7">
        <path fill-rule="evenodd" d="M5.47 5.47a.75.75 0 0 1 1.06 0L12 10.94l5.47-5.47a.75.75 0 1 1 1.06 1.06L13.06 12l5.47 5.47a.75.75 0 1 1-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 0 1-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"/>
      </svg>
    </button>

    <!-- Prev -->
    <button @click="prev()" class="absolute left-3 text-white opacity-70 transition-opacity hover:opacity-100" x-show="images.length > 1">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-9">
        <path fill-rule="evenodd" d="M7.72 12.53a.75.75 0 0 1 0-1.06l7.5-7.5a.75.75 0 1 1 1.06 1.06L9.31 12l6.97 6.97a.75.75 0 1 1-1.06 1.06l-7.5-7.5Z" clip-rule="evenodd"/>
      </svg>
    </button>

    <!-- Image -->
    <div class="flex flex-col items-center px-14 w-full max-w-5xl">
      <template x-for="(img, i) in images" :key="i">
        <div x-show="current === i" class="flex flex-col items-center w-full">
          <img
            :src="baseUrl + img.file"
            :alt="img.alt"
            class="object-contain max-w-full rounded-xl max-h-[80vh]"
          >
          <p x-text="img.title" class="mt-4 text-sm text-center text-white opacity-80"></p>
        </div>
      </template>

      <!-- Dots -->
      <div class="flex gap-2 mt-4" x-show="images.length > 1">
        <template x-for="(img, i) in images" :key="i">
          <button
            @click="current = i"
            :class="current === i ? 'bg-white' : 'bg-white/40'"
            class="rounded-full transition-colors size-2"
          ></button>
        </template>
      </div>
    </div>

    <!-- Next -->
    <button @click="next()" class="absolute right-3 text-white opacity-70 transition-opacity hover:opacity-100" x-show="images.length > 1">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-9">
        <path fill-rule="evenodd" d="M16.28 11.47a.75.75 0 0 1 0 1.06l-7.5 7.5a.75.75 0 0 1-1.06-1.06L14.69 12 7.72 5.03a.75.75 0 0 1 1.06-1.06l7.5 7.5Z" clip-rule="evenodd"/>
      </svg>
    </button>
  </div>
</div>
{{- end -}}

<article class="border shadow-md card bg-base-100 border-base-300">
  <div class="card-body">
    <div class="flex justify-between items-center mb-5">
      <span class="inline-flex items-center py-0.5 px-2.5 text-xs font-medium rounded bg-accent text-accent-content">
        {{ with .Params.tags }}{{ index . 0 | title }}{{ else }}Tutorial{{ end }}
      </span>
      <span class="text-sm text-gray-400">{{ .Date.Format "02 Jan 2006" }}</span>
    </div>
    <h3 class="mb-2 text-2xl font-semibold tracking-tight leading-none card-title">
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </h3>
    <p class="mb-3 font-normal text-gray-500">
      {{ with .Description }}{{ . }}{{ else }}{{ .Summary }}{{ end }}
    </p>
    <div class="flex justify-between items-center">
      <a href="{{ .RelPermalink }}" class="btn btn-primary btn-sm">
        Leggi
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-4 ms-2"><path fill-rule="evenodd" d="M16.72 7.72a.75.75 0 0 1 1.06 0l3.75 3.75a.75.75 0 0 1 0 1.06l-3.75 3.75a.75.75 0 1 1-1.06-1.06l2.47-2.47H3a.75.75 0 0 1 0-1.5h16.19l-2.47-2.47a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"/></svg>
      </a>
    </div>
  </div>
</article>

{{ define "main" }}
<article class="mx-auto max-w-3xl">
  <h1 class="mb-6 text-4xl font-bold tracking-tight">{{ .Title }}</h1>
  <div class="max-w-none prose">
    {{ .Content }}
  </div>
  {{ with .Params.links }}
  <div class="flex flex-col gap-4 mt-8">
    {{ range . }}
    <a href="{{ .url }}" target="_blank" rel="noopener noreferrer"
       class="inline-flex gap-3 items-center transition-colors text-base-content hover:text-primary">
      <img src="{{ .image | relURL }}" alt="{{ .name }}" class="object-contain size-6" />
      <span>{{ .name }}</span>
    </a>
    {{ end }}
  </div>
  {{ end }}
</article>
{{ end }}

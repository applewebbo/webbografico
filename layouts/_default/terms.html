{{ define "title" }}{{ .Title }} - {{ .Site.Title }}{{ end }}

{{ define "main" }}
<h1 class="section-title">{{ .Title }}</h1>
<ul class="flex flex-wrap gap-3">
  {{ range .Data.Terms.Alphabetical }}
  <li>
    <a href="{{ .Page.RelPermalink }}" class="rounded badge badge-accent badge-lg">
      {{ .Page.Title }} ({{ .Count }})
    </a>
  </li>
  {{ end }}
</ul>
{{ end }}
